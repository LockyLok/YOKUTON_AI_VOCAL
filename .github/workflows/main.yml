
name: Build YOKUTON VST3 Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build environment
        shell: pwsh
        run: |
          cmake --version
          Write-Host "Checking Visual Studio..."
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property installationPath
          } else {
            Write-Host "vswhere not found"
          }

      - name: Configure project
        run: cmake -S . -B build

      - name: Build VST3
        run: cmake --build build --config Release --target YOKUTON_VST3

      - name: Find VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem "build" -Recurse -Filter "*.vst3" | Select-Object -First 1
          if (-not $plugin) {
            throw "VST3 plugin not found after build"
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item -Path $plugin.FullName -Destination "dist/YOKUTON.vst3" -Recurse

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: YOKUTON-VST3-Windows
          path: dist/YOKUTON.vst3
          if-no-files-found: error
          retention-days: 14
